<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — OliveGrove</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <section>
      <div class="container">
        <h1 class="section-title">Your cart</h1>
        <p class="section-sub" id="free-shipping-note"></p>
        <div id="cart-root"></div>
      </div>
    </section>
  </main>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderLayout("cart");
    const root = document.getElementById("cart-root");
    const note = document.getElementById("free-shipping-note");

    function render() {
      const lines = Cart.lines();
      if (lines.length === 0) {
        note.textContent = "";
        root.innerHTML = `
          <div class="card empty">
            <div class="emoji">🧺</div>
            <p>Your cart is empty.</p>
            <a href="shop.html" class="btn btn-olive">Browse products</a>
          </div>`;
        return;
      }

      const t = Cart.totals();
      note.textContent = t.subtotal >= FREE_SHIPPING_FROM
        ? "🎉 You've unlocked free shipping!"
        : `Add ${money(FREE_SHIPPING_FROM - t.subtotal)} more for free shipping.`;

      root.innerHTML = `
        <div class="cart-layout">
          <div class="card">
            ${lines.map(({ product: p, qty, total }) => `
              <div class="cart-item">
                <div class="emoji">${p.emoji}</div>
                <div><strong>${escapeHtml(p.name)}</strong><br><small>${p.unit} · ${money(p.price)} each</small></div>
                <div class="qty">
                  <button data-dec="${p.id}" aria-label="Decrease">−</button>
                  <span>${qty}</span>
                  <button data-inc="${p.id}" aria-label="Increase">+</button>
                </div>
                <strong class="line-total">${money(total)}</strong>
                <button class="btn btn-link" data-remove="${p.id}">Remove</button>
              </div>`).join("")}
            <p style="text-align:right;margin-bottom:0"><button class="btn btn-link" id="clear-cart">Clear cart</button></p>
          </div>
          <div class="card">
            <h3 style="margin-top:0">Order summary</h3>
            <div class="summary-row"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${t.shipping === 0 ? "Free" : money(t.shipping)}</span></div>
            <div class="summary-row"><span>Tax (${TAX_RATE * 100}%)</span><span>${money(t.tax)}</span></div>
            <div class="summary-row total"><span>Total</span><span>${money(t.total)}</span></div>
            <a href="checkout.html" class="btn btn-primary" style="width:100%;text-align:center;margin-top:16px">Proceed to checkout</a>
            <a href="shop.html" class="btn btn-outline" style="width:100%;text-align:center;margin-top:10px">Continue shopping</a>
          </div>
        </div>`;
    }

    root.addEventListener("click", e => {
      const el = e.target;
      const items = Cart.items();
      if (el.dataset.inc) Cart.setQty(el.dataset.inc, items[el.dataset.inc] + 1);
      else if (el.dataset.dec) Cart.setQty(el.dataset.dec, items[el.dataset.dec] - 1);
      else if (el.dataset.remove) Cart.remove(el.dataset.remove);
      else if (el.id === "clear-cart") {
        if (!confirm("Remove all items from your cart?")) return;
        Cart.clear();
      } else return;
      render();
    });

    render();
  </script>
</body>
</html>
